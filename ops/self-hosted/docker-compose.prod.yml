name: orbi

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  postgres:
    <<: *service-defaults
    image: ${ORBI_POSTGRES_IMAGE:?Set ORBI_POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${ORBI_POSTGRES_DB:?Set ORBI_POSTGRES_DB}
      POSTGRES_USER: ${ORBI_POSTGRES_USER:?Set ORBI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ORBI_POSTGRES_PASSWORD:?Set ORBI_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=200
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f
      - -c
      - log_min_duration_statement=1000
      - -c
      - deadlock_timeout=1s
      - -c
      - idle_in_transaction_session_timeout=60s
    volumes:
      - orbi_postgres_data:/var/lib/postgresql/data
      - orbi_postgres_wal_archive:/var/lib/postgresql/wal-archive
      - ../../database/local/000_create_keycloak_database.sql:/docker-entrypoint-initdb.d/000_create_keycloak_database.sql:ro
      - ../../database/local/001_orbi_auth_compat.sql:/docker-entrypoint-initdb.d/001_orbi_auth_compat.sql:ro
      - ../../database/local/002_keycloak_identity_links.sql:/docker-entrypoint-initdb.d/002_keycloak_identity_links.sql:ro
      - ../../database/main.sql:/docker-entrypoint-initdb.d/010_orbi_main.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    shm_size: 1gb
    mem_limit: 8g
    cpus: 3.0
    networks:
      - private

  valkey:
    <<: *service-defaults
    image: ${ORBI_VALKEY_IMAGE:?Set ORBI_VALKEY_IMAGE}
    command:
      - valkey-server
      - /etc/valkey/valkey.conf
      - --requirepass
      - ${ORBI_VALKEY_PASSWORD:?Set ORBI_VALKEY_PASSWORD}
      - --maxmemory
      - 3gb
    volumes:
      - orbi_valkey_data:/data
      - ./Auth_Security/valkey.conf:/etc/valkey/valkey.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${ORBI_VALKEY_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      ORBI_VALKEY_PASSWORD: ${ORBI_VALKEY_PASSWORD:?Set ORBI_VALKEY_PASSWORD}
    mem_limit: 4g
    cpus: 1.5
    networks:
      - private

  keycloak:
    <<: *service-defaults
    image: ${ORBI_KEYCLOAK_IMAGE:?Set ORBI_KEYCLOAK_IMAGE}
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${ORBI_POSTGRES_USER:?Set ORBI_POSTGRES_USER}
      KC_DB_PASSWORD: ${ORBI_POSTGRES_PASSWORD:?Set ORBI_POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${ORBI_KEYCLOAK_ADMIN_USERNAME:?Set ORBI_KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ORBI_KEYCLOAK_ADMIN_PASSWORD:?Set ORBI_KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${ORBI_KEYCLOAK_PUBLIC_URL:?Set ORBI_KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_STRICT: "true"
    volumes:
      - ./Auth_Security/keycloak/orbi-realm.json:/opt/keycloak/data/import/orbi-realm.json:ro
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 3g
    cpus: 1.5
    networks:
      - private
      - edge
      - ops

  database-init:
    image: ${ORBI_POSTGRES_IMAGE:?Set ORBI_POSTGRES_IMAGE}
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${ORBI_POSTGRES_DB}
      PGUSER: ${ORBI_POSTGRES_USER}
      PGPASSWORD: ${ORBI_POSTGRES_PASSWORD}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until pg_isready; do sleep 2; done
        psql --set=ON_ERROR_STOP=1 --file=/migrations/000_create_keycloak_database.sql
        psql --set=ON_ERROR_STOP=1 --file=/migrations/001_orbi_auth_compat.sql
        psql --set=ON_ERROR_STOP=1 --file=/migrations/002_keycloak_identity_links.sql
        psql --set=ON_ERROR_STOP=1 --file=/master/main.sql
        psql --set=ON_ERROR_STOP=1 --file=/migrations/003_native_postgres_runtime.sql
    volumes:
      - ../../database/local:/migrations:ro
      - ../../database/main.sql:/master/main.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  storage:
    <<: *service-defaults
    image: ${ORBI_STORAGE_IMAGE:?Set ORBI_STORAGE_IMAGE}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ORBI_STORAGE_ROOT_USER:?Set ORBI_STORAGE_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${ORBI_STORAGE_ROOT_PASSWORD:?Set ORBI_STORAGE_ROOT_PASSWORD}
    volumes:
      - orbi_storage_data:/data
    mem_limit: 3g
    cpus: 1.5
    networks:
      - private

  storage-init:
    image: ${ORBI_STORAGE_CLIENT_IMAGE:?Set ORBI_STORAGE_CLIENT_IMAGE}
    restart: "no"
    depends_on:
      storage:
        condition: service_started
    environment:
      ORBI_STORAGE_ROOT_USER: ${ORBI_STORAGE_ROOT_USER:?Set ORBI_STORAGE_ROOT_USER}
      ORBI_STORAGE_ROOT_PASSWORD: ${ORBI_STORAGE_ROOT_PASSWORD:?Set ORBI_STORAGE_ROOT_PASSWORD}
      ORBI_STORAGE_ASSET_BUCKET: ${ORBI_STORAGE_ASSET_BUCKET:-orbi-assets}
      ORBI_STORAGE_KYC_BUCKET: ${ORBI_STORAGE_KYC_BUCKET:-orbi-kyc}
      ORBI_STORAGE_BACKUP_BUCKET: ${ORBI_STORAGE_BACKUP_BUCKET:-orbi-backups}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set orbi http://storage:9000 "$${ORBI_STORAGE_ROOT_USER}" "$${ORBI_STORAGE_ROOT_PASSWORD}"; do sleep 2; done
        mc mb --ignore-existing "orbi/$${ORBI_STORAGE_ASSET_BUCKET}"
        mc mb --ignore-existing "orbi/$${ORBI_STORAGE_KYC_BUCKET}"
        mc mb --ignore-existing "orbi/$${ORBI_STORAGE_BACKUP_BUCKET}"
        mc anonymous set none "orbi/$${ORBI_STORAGE_ASSET_BUCKET}"
        mc anonymous set none "orbi/$${ORBI_STORAGE_KYC_BUCKET}"
        mc anonymous set none "orbi/$${ORBI_STORAGE_BACKUP_BUCKET}"
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  core:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: orbi-core:${ORBI_RELEASE_ID:-local}
    env_file:
      - ${ORBI_CORE_ENV_FILE:-./.env.production}
    environment:
      NODE_ENV: production
      PORT: 3000
      ORBI_RUNTIME_ENVIRONMENT: live
      ORBI_ENABLE_SANDBOX_ROUTES: "false"
      ORBI_TLS_ENABLED: ${ORBI_CORE_TLS_ENABLED:-false}
      ORBI_AUTH_PROVIDER: keycloak
      ORBI_INTERNAL_MTLS_SOURCE: ${ORBI_CORE_INTERNAL_MTLS_SOURCE:-proxy}
      ORBI_INTERNAL_MTLS_MODE: ${ORBI_INTERNAL_MTLS_MODE:-required}
      ORBI_ALLOW_HMAC_ONLY_INTERNAL_REQUESTS: ${ORBI_ALLOW_HMAC_ONLY_INTERNAL_REQUESTS:-false}
      ORBI_ALLOW_PRIVATE_HTTP_INTERNAL_REQUESTS: ${ORBI_ALLOW_PRIVATE_HTTP_INTERNAL_REQUESTS:-false}
      ORBI_REQUIRE_SIGNED_INTERNAL_REQUESTS: ${ORBI_REQUIRE_SIGNED_INTERNAL_REQUESTS:-true}
      ORBI_ALLOW_LEGACY_INTERNAL_WORKER_AUTH: ${ORBI_ALLOW_LEGACY_INTERNAL_WORKER_AUTH:-false}
      ORBI_TLS_CERT_PATH: ${ORBI_TLS_CERT_PATH:-/etc/orbi/tls/fullchain.pem}
      ORBI_TLS_KEY_PATH: ${ORBI_TLS_KEY_PATH:-/etc/orbi/tls/privkey.pem}
      ORBI_TLS_CA_PATH: ${ORBI_TLS_CA_PATH:-/etc/orbi/tls/fullchain.pem}
      ORBI_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      ORBI_KEYCLOAK_ISSUER: ${ORBI_KEYCLOAK_PUBLIC_URL}/realms/${ORBI_KEYCLOAK_REALM:-orbi}
      ORBI_KEYCLOAK_AUDIENCE: ${ORBI_KEYCLOAK_AUDIENCE:-orbi-core}
      ORBI_KEYCLOAK_REALM: ${ORBI_KEYCLOAK_REALM:-orbi}
      ORBI_KEYCLOAK_MOBILE_CLIENT_ID: ${ORBI_KEYCLOAK_MOBILE_CLIENT_ID:-orbi-mobile}
      ORBI_PAY_GATEWAY_INTERNAL_BASE_URL: ${ORBI_PAY_GATEWAY_INTERNAL_BASE_URL:-http://pay-gateway:3100}
      ORBI_KEYCLOAK_ADMIN_USERNAME: ${ORBI_KEYCLOAK_ADMIN_USERNAME}
      ORBI_KEYCLOAK_ADMIN_PASSWORD: ${ORBI_KEYCLOAK_ADMIN_PASSWORD}
      DATABASE_URL: postgresql://${ORBI_POSTGRES_USER}:${ORBI_POSTGRES_PASSWORD}@postgres:5432/${ORBI_POSTGRES_DB}
      VALKEY_URL: redis://:${ORBI_VALKEY_PASSWORD}@valkey:6379/0
      ORBI_CORE_ENV_FILE: ${ORBI_CORE_ENV_FILE:-/etc/orbi/core.env}
      ORBI_BACKUP_LOCAL_DIR: /srv/orbi/backups/database
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY_ID: ${ORBI_STORAGE_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${ORBI_STORAGE_ROOT_PASSWORD}
      S3_BUCKET: ${ORBI_STORAGE_ASSET_BUCKET:-orbi-assets}
      KYC_BUCKET: ${ORBI_STORAGE_KYC_BUCKET:-orbi-kyc}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - ${ORBI_CORE_TLS_CERT_DIRECTORY:-/srv/orbi/secrets/mtls/core}:/etc/orbi/tls:ro
      - /srv/orbi/backups/database:/srv/orbi/backups/database:ro
      - orbi_public_uploads:/app/public/uploads
    mem_limit: 6g
    cpus: 3.0
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const https=require('https');const http=require('http');const tls=String(process.env.ORBI_TLS_ENABLED||'').toLowerCase()==='true';const mod=tls?https:http;const req=mod.get({host:'127.0.0.1',port:3000,path:'/health',rejectUnauthorized:false},r=>{if(!((r.statusCode>=200&&r.statusCode<300)||r.statusCode===308))process.exit(1);r.resume();});req.on('error',()=>process.exit(1));req.setTimeout(5000,()=>{req.destroy();process.exit(1);});"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks:
      - private

  storage-sandbox:
    <<: *service-defaults
    image: ${ORBI_STORAGE_IMAGE:?Set ORBI_STORAGE_IMAGE}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ORBI_CORE_SANDBOX_STORAGE_ACCESS_KEY:?Set ORBI_CORE_SANDBOX_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${ORBI_CORE_SANDBOX_STORAGE_SECRET_KEY:?Set ORBI_CORE_SANDBOX_STORAGE_SECRET_KEY}
    volumes:
      - orbi_sandbox_storage_data:/data
    mem_limit: 1g
    cpus: 0.5
    networks:
      - sandbox_private

  postgres-sandbox:
    <<: *service-defaults
    image: ${ORBI_POSTGRES_IMAGE:?Set ORBI_POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${ORBI_CORE_SANDBOX_POSTGRES_DB:-orbi_core_sandbox}
      POSTGRES_USER: ${ORBI_CORE_SANDBOX_POSTGRES_USER:?Set ORBI_CORE_SANDBOX_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ORBI_CORE_SANDBOX_POSTGRES_PASSWORD:?Set ORBI_CORE_SANDBOX_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - orbi_sandbox_postgres_data:/var/lib/postgresql/data
      - ../../database/main.sql:/docker-entrypoint-initdb.d/010_orbi_main.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - sandbox_private
      # Loopback-only database integration access; no live service is attached.
      - sandbox_test_bridge

  valkey-sandbox:
    <<: *service-defaults
    image: ${ORBI_VALKEY_IMAGE:?Set ORBI_VALKEY_IMAGE}
    command: ["valkey-server", "--requirepass", "${ORBI_CORE_SANDBOX_VALKEY_PASSWORD:?Set ORBI_CORE_SANDBOX_VALKEY_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - orbi_sandbox_valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${ORBI_CORE_SANDBOX_VALKEY_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    environment:
      ORBI_CORE_SANDBOX_VALKEY_PASSWORD: ${ORBI_CORE_SANDBOX_VALKEY_PASSWORD:?Set ORBI_CORE_SANDBOX_VALKEY_PASSWORD}
    networks:
      - sandbox_private

  storage-sandbox-init:
    image: ${ORBI_STORAGE_CLIENT_IMAGE:?Set ORBI_STORAGE_CLIENT_IMAGE}
    restart: "no"
    depends_on:
      storage-sandbox:
        condition: service_started
    environment:
      SANDBOX_STORAGE_USER: ${ORBI_CORE_SANDBOX_STORAGE_ACCESS_KEY:?Set ORBI_CORE_SANDBOX_STORAGE_ACCESS_KEY}
      SANDBOX_STORAGE_PASSWORD: ${ORBI_CORE_SANDBOX_STORAGE_SECRET_KEY:?Set ORBI_CORE_SANDBOX_STORAGE_SECRET_KEY}
      SANDBOX_ASSET_BUCKET: ${ORBI_CORE_SANDBOX_ASSET_BUCKET:-orbi-sandbox-assets}
      SANDBOX_KYC_BUCKET: ${ORBI_CORE_SANDBOX_KYC_BUCKET:-orbi-sandbox-kyc}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set sandbox http://storage-sandbox:9000 "$${SANDBOX_STORAGE_USER}" "$${SANDBOX_STORAGE_PASSWORD}"; do sleep 2; done
        mc mb --ignore-existing "sandbox/$${SANDBOX_ASSET_BUCKET}"
        mc mb --ignore-existing "sandbox/$${SANDBOX_KYC_BUCKET}"
        mc anonymous set none "sandbox/$${SANDBOX_ASSET_BUCKET}"
        mc anonymous set none "sandbox/$${SANDBOX_KYC_BUCKET}"
    security_opt:
      - no-new-privileges:true
    networks:
      - sandbox_private
      - edge
      - ops

  core-sandbox:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
    image: orbi-core:${ORBI_RELEASE_ID:-local}
    env_file:
      - ${ORBI_CORE_SANDBOX_ENV_FILE:?Set ORBI_CORE_SANDBOX_ENV_FILE}
    environment:
      NODE_ENV: production
      PORT: 3001
      ORBI_RUNTIME_ENVIRONMENT: sandbox
      ORBI_ENABLE_SANDBOX_ROUTES: "true"
      ORBI_ENFORCE_HTTPS: "true"
      ORBI_TRUST_PROXY: "true"
      ORBI_AUTH_PROVIDER: keycloak
      ORBI_REQUIRE_SIGNED_INTERNAL_REQUESTS: "true"
      ORBI_ALLOW_LEGACY_INTERNAL_WORKER_AUTH: "false"
      ORBI_ALLOW_HMAC_ONLY_INTERNAL_REQUESTS: "true"
      ORBI_INTERNAL_MTLS_MODE: ${ORBI_CORE_SANDBOX_INTERNAL_MTLS_MODE:-optional}
      ORBI_INTERNAL_MTLS_SOURCE: proxy
      ORBI_KEYCLOAK_INTERNAL_URL: http://keycloak-sandbox:8080
      ORBI_KEYCLOAK_ISSUER: ${ORBI_KEYCLOAK_SANDBOX_PUBLIC_URL:-https://auth.orbifinancial.com/realms/orbi-sandbox}
      ORBI_KEYCLOAK_REALM: orbi-sandbox
      ORBI_KEYCLOAK_AUDIENCE: ${ORBI_KEYCLOAK_SANDBOX_AUDIENCE:-orbi-core-sandbox}
      ORBI_KEYCLOAK_MOBILE_CLIENT_ID: ${ORBI_KEYCLOAK_SANDBOX_MOBILE_CLIENT_ID:-orbi-mobile-sandbox}
      DATABASE_URL: postgresql://${ORBI_CORE_SANDBOX_POSTGRES_USER}:${ORBI_CORE_SANDBOX_POSTGRES_PASSWORD}@postgres-sandbox:5432/${ORBI_CORE_SANDBOX_POSTGRES_DB:-orbi_core_sandbox}
      VALKEY_URL: redis://:${ORBI_CORE_SANDBOX_VALKEY_PASSWORD}@valkey-sandbox:6379/0
      WORKER_SIGNING_SECRET: ${PAYMENT_GATEWAY_SANDBOX_WORKER_SIGNING_SECRET:?Set PAYMENT_GATEWAY_SANDBOX_WORKER_SIGNING_SECRET}
      ORBI_PAY_GATEWAY_INTERNAL_BASE_URL: http://pay-gateway-sandbox:3101
      S3_ENDPOINT: ${ORBI_CORE_SANDBOX_STORAGE_ENDPOINT:-http://storage-sandbox:9000}
      S3_ACCESS_KEY_ID: ${ORBI_CORE_SANDBOX_STORAGE_ACCESS_KEY:?Set ORBI_CORE_SANDBOX_STORAGE_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${ORBI_CORE_SANDBOX_STORAGE_SECRET_KEY:?Set ORBI_CORE_SANDBOX_STORAGE_SECRET_KEY}
      S3_BUCKET: ${ORBI_CORE_SANDBOX_ASSET_BUCKET:-orbi-sandbox-assets}
      KYC_BUCKET: ${ORBI_CORE_SANDBOX_KYC_BUCKET:-orbi-sandbox-kyc}
    depends_on:
      postgres-sandbox:
        condition: service_healthy
      valkey-sandbox:
        condition: service_healthy
      storage-sandbox-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - "/tmp:size=256m,mode=1777"
    expose: ["3001"]
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - sandbox_private

  pay-gateway:
    <<: *service-defaults
    build:
      context: ../../../ORBI PAY GATEWAY
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: orbi-pay-gateway:${ORBI_PAY_GATEWAY_RELEASE_ID:-local}
    environment:
      NODE_ENV: production
      PAYMENT_GATEWAY_PORT: 3100
      PAYMENT_GATEWAY_PUBLIC_BASE_URL: ${PAYMENT_GATEWAY_PUBLIC_BASE_URL:-https://pay.orbifinancial.com}
      PAYMENT_GATEWAY_PROVIDER_MODE: ${PAYMENT_GATEWAY_PROVIDER_MODE:-live}
      PAYMENT_GATEWAY_CREDENTIAL_MODE: ${PAYMENT_GATEWAY_CREDENTIAL_MODE:-tokenized}
      PAYMENT_GATEWAY_REQUIRE_STRONG_CUSTOMER_AUTH: ${PAYMENT_GATEWAY_REQUIRE_STRONG_CUSTOMER_AUTH:-true}
      DATABASE_URL: postgresql://${ORBI_POSTGRES_USER}:${ORBI_POSTGRES_PASSWORD}@postgres:5432/${ORBI_POSTGRES_DB}
      ORBI_SECRET_ENCRYPTION_KEY: ${ORBI_SECRET_ENCRYPTION_KEY}
      PAYMENT_GATEWAY_PROVIDER_MANIFEST_PATH: /app/config/providers.json
      PAYMENT_GATEWAY_SERVICE_REGISTRY_PATH: /app/config/services.json
      PAYMENT_GATEWAY_OPERATOR_DISCOVERY_API_KEY: ${PAYMENT_GATEWAY_OPERATOR_DISCOVERY_API_KEY}
      PAYMENT_GATEWAY_OIDC_IDENTITY_ISSUER: ${PAYMENT_GATEWAY_OIDC_IDENTITY_ISSUER:-https://auth.orbifinancial.com/realms/orbi}
      PAYMENT_GATEWAY_OIDC_IDENTITY_BACKCHANNEL_URL: ${PAYMENT_GATEWAY_OIDC_IDENTITY_BACKCHANNEL_URL:-http://keycloak:8080/realms/orbi}
      PAYMENT_GATEWAY_OIDC_IDENTITY_AUDIENCE: ${PAYMENT_GATEWAY_OIDC_IDENTITY_AUDIENCE:-orbi-pay-identity}
      PAYMENT_GATEWAY_OIDC_AUTHORIZATION_CLIENT_ID: ${PAYMENT_GATEWAY_OIDC_AUTHORIZATION_CLIENT_ID:-orbi-pay-developers}
      PAYMENT_GATEWAY_FINANCIAL_TOKEN_AUDIENCE: ${PAYMENT_GATEWAY_FINANCIAL_TOKEN_AUDIENCE:-orbi-pay-api}
      PAYMENT_GATEWAY_OBP_SANDBOX_TOOLS_ENABLED: ${PAYMENT_GATEWAY_OBP_SANDBOX_TOOLS_ENABLED:-false}
      ORBI_CORE_INTERNAL_BASE_URL: ${ORBI_CORE_INTERNAL_BASE_URL:-http://core:3000}
      PAYMENT_GATEWAY_ALLOW_PRIVATE_HTTP_CORE: ${PAYMENT_GATEWAY_ALLOW_PRIVATE_HTTP_CORE:-true}
      ORBI_CORE_TRUSTED_GATEWAY_EVENT_PATH: ${ORBI_CORE_TRUSTED_GATEWAY_EVENT_PATH:-/api/internal/gateway/provider-events}
      ORBI_CORE_TRUSTED_SERVICE_PAYMENT_REQUEST_PATH: ${ORBI_CORE_TRUSTED_SERVICE_PAYMENT_REQUEST_PATH:-/api/internal/pay-gateway/service-payment-requests}
      ORBI_CORE_TRUSTED_PAYSAFE_BALANCE_PATH: ${ORBI_CORE_TRUSTED_PAYSAFE_BALANCE_PATH:-/api/internal/pay-gateway/paysafe-balances}
      ORBI_CORE_TRUSTED_BUSINESS_REGISTRATION_PATH: ${ORBI_CORE_TRUSTED_BUSINESS_REGISTRATION_PATH:-/api/internal/pay-gateway/business/registrations}
      ORBI_CORE_TRUSTED_MERCHANT_ORDER_PAYMENT_STATUS_PATH: ${ORBI_CORE_TRUSTED_MERCHANT_ORDER_PAYMENT_STATUS_PATH:-/api/internal/pay-gateway/merchant-order-payment-status}
      ORBI_CORE_TRUSTED_MERCHANT_SETTLEMENTS_PATH: ${ORBI_CORE_TRUSTED_MERCHANT_SETTLEMENTS_PATH:-/api/internal/pay-gateway/merchant-settlements}
      ORBI_CORE_CALLBACK_TIMEOUT_MS: ${ORBI_CORE_CALLBACK_TIMEOUT_MS:-30000}
      PAYMENT_GATEWAY_WORKER_ID: ${PAYMENT_GATEWAY_WORKER_ID:-orbi-payment-gateway}
      PAYMENT_GATEWAY_WORKER_SCOPES: ${PAYMENT_GATEWAY_WORKER_SCOPES:-gateway:events:write,gateway:service-payments:write,gateway:service-payments:result,gateway:identity:read,gateway:notifications:push,gateway:paysafe-balances:read,gateway:business-registration:write,gateway:merchant-payments:read,gateway:merchant-settlements:read}
      WORKER_SIGNING_SECRET: ${WORKER_SIGNING_SECRET}
      WORKER_KEY_ID: ${WORKER_KEY_ID:-payment-gateway-v1}
      PAYMENT_GATEWAY_INTERNAL_MTLS_ENABLED: ${PAYMENT_GATEWAY_INTERNAL_MTLS_ENABLED:-false}
      PAYMENT_GATEWAY_AUDIT_EVENT_SINK_PATH: ${PAYMENT_GATEWAY_AUDIT_EVENT_SINK_PATH:-/app/audit/audit-events.jsonl}
      PAYMENT_GATEWAY_OAUTH_ISSUER_URL: ${PAYMENT_GATEWAY_OAUTH_ISSUER_URL:-https://pay.orbifinancial.com}
      PAYMENT_GATEWAY_OAUTH_INTROSPECTION_URL: ${PAYMENT_GATEWAY_OAUTH_INTROSPECTION_URL:-https://pay.orbifinancial.com/oauth/introspect}
      ORBI_SHOP_PAY_API_KEY_TOKEN_REF: ${ORBI_SHOP_PAY_API_KEY_TOKEN_REF:-env://ORBI_SHOP_PAY_API_KEY}
      ORBI_SHOP_PAY_API_KEY: ${ORBI_SHOP_PAY_API_KEY}
      ORBI_SHOP_PAY_WEBHOOK_SECRET_TOKEN_REF: ${ORBI_SHOP_PAY_WEBHOOK_SECRET_TOKEN_REF:-env://ORBI_SHOP_PAY_WEBHOOK_SECRET}
      ORBI_SHOP_PAY_WEBHOOK_SECRET: ${ORBI_SHOP_PAY_WEBHOOK_SECRET}
      ORBI_SHOP_PAY_WEBHOOK_URL: ${ORBI_SHOP_PAY_WEBHOOK_URL:-https://shop.orbifinancial.com/api/orbi-pay/webhooks}
      ORBI_SHOP_MERCHANT_ID: ${ORBI_SHOP_MERCHANT_ID}
    volumes:
      - ../../../ORBI PAY GATEWAY/config/providers.example.json:/app/config/providers.json:ro
      - ../../../ORBI PAY GATEWAY/config/services.example.json:/app/config/services.json:ro
      - ${ORBI_PAY_GATEWAY_AUDIT_EVENTS_ROOT:-../../../ORBI GATEWAY/Audit Events/live}:/app/audit
    expose:
      - "3100"
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 2g
    cpus: 1.0
    networks:
      - private
      - edge

  pay-gateway-sandbox:
    <<: *service-defaults
    build:
      context: ../../../ORBI PAY GATEWAY
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: orbi-pay-gateway:${ORBI_PAY_GATEWAY_RELEASE_ID:-local}
    environment:
      NODE_ENV: production
      PAYMENT_GATEWAY_PORT: 3101
      PAYMENT_GATEWAY_PUBLIC_BASE_URL: https://sandbox-pay.orbifinancial.com
      PAYMENT_GATEWAY_PROVIDER_MODE: sandbox
      PAYMENT_GATEWAY_CREDENTIAL_MODE: tokenized
      PAYMENT_GATEWAY_REQUIRE_STRONG_CUSTOMER_AUTH: ${PAYMENT_GATEWAY_SANDBOX_REQUIRE_STRONG_CUSTOMER_AUTH:-true}
      DATABASE_URL: ${PAYMENT_GATEWAY_SANDBOX_DATABASE_URL:?Set PAYMENT_GATEWAY_SANDBOX_DATABASE_URL}
      ORBI_SECRET_ENCRYPTION_KEY: ${PAYMENT_GATEWAY_SANDBOX_SECRET_ENCRYPTION_KEY:?Set PAYMENT_GATEWAY_SANDBOX_SECRET_ENCRYPTION_KEY}
      PAYMENT_GATEWAY_PROVIDER_MANIFEST_PATH: /app/config/providers.json
      PAYMENT_GATEWAY_SERVICE_REGISTRY_PATH: /app/config/services.json
      PAYMENT_GATEWAY_OPERATOR_DISCOVERY_API_KEY: ${PAYMENT_GATEWAY_SANDBOX_OPERATOR_DISCOVERY_API_KEY:?Set PAYMENT_GATEWAY_SANDBOX_OPERATOR_DISCOVERY_API_KEY}
      PAYMENT_GATEWAY_OIDC_IDENTITY_ISSUER: ${PAYMENT_GATEWAY_SANDBOX_OIDC_IDENTITY_ISSUER:-https://auth.orbifinancial.com/realms/orbi-sandbox}
      PAYMENT_GATEWAY_OIDC_IDENTITY_BACKCHANNEL_URL: ${PAYMENT_GATEWAY_SANDBOX_OIDC_IDENTITY_BACKCHANNEL_URL:-http://keycloak-sandbox:8080/realms/orbi-sandbox}
      PAYMENT_GATEWAY_OIDC_IDENTITY_AUDIENCE: ${PAYMENT_GATEWAY_SANDBOX_OIDC_IDENTITY_AUDIENCE:-orbi-pay-sandbox-identity}
      PAYMENT_GATEWAY_OIDC_AUTHORIZATION_CLIENT_ID: ${PAYMENT_GATEWAY_SANDBOX_OIDC_AUTHORIZATION_CLIENT_ID:-orbi-pay-sandbox-developers}
      PAYMENT_GATEWAY_FINANCIAL_TOKEN_AUDIENCE: ${PAYMENT_GATEWAY_SANDBOX_FINANCIAL_TOKEN_AUDIENCE:-orbi-pay-sandbox-api}
      PAYMENT_GATEWAY_OBP_SANDBOX_TOOLS_ENABLED: ${PAYMENT_GATEWAY_SANDBOX_TOOLS_ENABLED:-true}
      ORBI_CORE_INTERNAL_BASE_URL: ${ORBI_CORE_SANDBOX_INTERNAL_BASE_URL:-http://core-sandbox:3001}
      PAYMENT_GATEWAY_ALLOW_PRIVATE_HTTP_CORE: ${PAYMENT_GATEWAY_SANDBOX_ALLOW_PRIVATE_HTTP_CORE:-true}
      ORBI_CORE_TRUSTED_GATEWAY_EVENT_PATH: ${ORBI_CORE_SANDBOX_TRUSTED_GATEWAY_EVENT_PATH:-/api/internal/gateway/provider-events}
      ORBI_CORE_TRUSTED_SERVICE_PAYMENT_REQUEST_PATH: ${ORBI_CORE_SANDBOX_TRUSTED_SERVICE_PAYMENT_REQUEST_PATH:-/api/internal/pay-gateway/service-payment-requests}
      ORBI_CORE_TRUSTED_SERVICE_PAYMENT_CHALLENGE_RESPOND_PATH: ${ORBI_CORE_SANDBOX_TRUSTED_SERVICE_PAYMENT_CHALLENGE_RESPOND_PATH:-/api/internal/pay-gateway/service-payment-challenges}
      ORBI_CORE_TRUSTED_PAYSAFE_BALANCE_PATH: ${ORBI_CORE_SANDBOX_TRUSTED_PAYSAFE_BALANCE_PATH:-/api/internal/pay-gateway/paysafe-balances}
      ORBI_CORE_TRUSTED_BUSINESS_REGISTRATION_PATH: ${ORBI_CORE_SANDBOX_TRUSTED_BUSINESS_REGISTRATION_PATH:-/api/internal/pay-gateway/business/registrations}
      ORBI_CORE_TRUSTED_PAYMENT_PROFILE_PATH: ${ORBI_CORE_SANDBOX_TRUSTED_PAYMENT_PROFILE_PATH:-/api/internal/pay-gateway/payment-profiles}
      ORBI_CORE_TRUSTED_MERCHANT_ORDER_PAYMENT_STATUS_PATH: ${ORBI_CORE_SANDBOX_TRUSTED_MERCHANT_ORDER_PAYMENT_STATUS_PATH:-/api/internal/pay-gateway/merchant-order-payment-status}
      ORBI_CORE_TRUSTED_MERCHANT_SETTLEMENTS_PATH: ${ORBI_CORE_SANDBOX_TRUSTED_MERCHANT_SETTLEMENTS_PATH:-/api/internal/pay-gateway/merchant-settlements}
      ORBI_CORE_CALLBACK_TIMEOUT_MS: ${ORBI_CORE_SANDBOX_CALLBACK_TIMEOUT_MS:-30000}
      PAYMENT_GATEWAY_WORKER_ID: ${PAYMENT_GATEWAY_SANDBOX_WORKER_ID:?Set PAYMENT_GATEWAY_SANDBOX_WORKER_ID}
      PAYMENT_GATEWAY_WORKER_SCOPES: ${PAYMENT_GATEWAY_SANDBOX_WORKER_SCOPES:-gateway:events:write,gateway:service-payments:write,gateway:service-payments:result,gateway:identity:read,gateway:notifications:push,gateway:paysafe-balances:read,gateway:business-registration:write,gateway:payment-profiles:write,gateway:merchant-payments:read,gateway:merchant-settlements:read}
      WORKER_SIGNING_SECRET: ${PAYMENT_GATEWAY_SANDBOX_WORKER_SIGNING_SECRET:?Set PAYMENT_GATEWAY_SANDBOX_WORKER_SIGNING_SECRET}
      WORKER_KEY_ID: ${PAYMENT_GATEWAY_SANDBOX_WORKER_KEY_ID:?Set PAYMENT_GATEWAY_SANDBOX_WORKER_KEY_ID}
      PAYMENT_GATEWAY_INTERNAL_MTLS_ENABLED: ${PAYMENT_GATEWAY_SANDBOX_INTERNAL_MTLS_ENABLED:-false}
      PAYMENT_GATEWAY_AUDIT_EVENT_SINK_PATH: ${PAYMENT_GATEWAY_SANDBOX_AUDIT_EVENT_SINK_PATH:-/app/audit/audit-events.jsonl}
      PAYMENT_GATEWAY_OAUTH_ISSUER_URL: ${PAYMENT_GATEWAY_SANDBOX_OAUTH_ISSUER_URL:-https://sandbox-pay.orbifinancial.com}
      PAYMENT_GATEWAY_OAUTH_INTROSPECTION_URL: ${PAYMENT_GATEWAY_SANDBOX_OAUTH_INTROSPECTION_URL:-https://sandbox-pay.orbifinancial.com/oauth/introspect}
      ORBI_SHOP_PAY_API_KEY_TOKEN_REF: ${ORBI_SHOP_SANDBOX_PAY_API_KEY_TOKEN_REF:-env://ORBI_SHOP_SANDBOX_PAY_API_KEY}
      ORBI_SHOP_PAY_API_KEY: ${ORBI_SHOP_SANDBOX_PAY_API_KEY:?Set ORBI_SHOP_SANDBOX_PAY_API_KEY}
      ORBI_SHOP_PAY_WEBHOOK_SECRET_TOKEN_REF: ${ORBI_SHOP_SANDBOX_PAY_WEBHOOK_SECRET_TOKEN_REF:-env://ORBI_SHOP_SANDBOX_PAY_WEBHOOK_SECRET}
      ORBI_SHOP_PAY_WEBHOOK_SECRET: ${ORBI_SHOP_SANDBOX_PAY_WEBHOOK_SECRET:?Set ORBI_SHOP_SANDBOX_PAY_WEBHOOK_SECRET}
      ORBI_SHOP_PAY_WEBHOOK_URL: ${ORBI_SHOP_SANDBOX_PAY_WEBHOOK_URL:?Set ORBI_SHOP_SANDBOX_PAY_WEBHOOK_URL}
      ORBI_SHOP_MERCHANT_ID: ${ORBI_SHOP_SANDBOX_MERCHANT_ID:?Set ORBI_SHOP_SANDBOX_MERCHANT_ID}
    volumes:
      - ../../../ORBI PAY GATEWAY/config/providers.example.json:/app/config/providers.json:ro
      - ../../../ORBI PAY GATEWAY/config/services.example.json:/app/config/services.json:ro
      - ${ORBI_PAY_GATEWAY_AUDIT_EVENTS_SANDBOX_ROOT:-../../../ORBI GATEWAY/Audit Events/sandbox}:/app/audit
    expose:
      - "3101"
    ports:
      - "127.0.0.1:3101:3101"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3101/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 2g
    cpus: 1.0
    networks:
      - sandbox_private

  gateway:
    <<: *service-defaults
    image: nginx:1.27-alpine
    depends_on:
      core:
        condition: service_healthy
      pay-gateway:
        condition: service_healthy
      pay-gateway-sandbox:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./Gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./Gateway/auth-index.html:/usr/share/nginx/orbi-auth/index.html:ro
    mem_limit: 512m
    cpus: 0.5
    profiles:
      - direct-edge
    networks:
      - edge
      - private
      - sandbox_private

  prometheus:
    <<: *service-defaults
    image: ${ORBI_PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${ORBI_PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./Observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus-alerts.yml:/etc/prometheus/orbi-alerts.yml:ro
      - ${ORBI_MONITOR_KEY_FILE:?Set ORBI_MONITOR_KEY_FILE}:/run/secrets/orbi_monitor_api_key:ro
      - orbi_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 2g
    cpus: 1.0
    networks:
      - ops

  grafana:
    <<: *service-defaults
    image: ${ORBI_GRAFANA_IMAGE:-grafana/grafana:12.1.0}
    environment:
      GF_SECURITY_ADMIN_USER: ${ORBI_GRAFANA_ADMIN_USER:-orbi-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${ORBI_GRAFANA_ADMIN_PASSWORD:?Set ORBI_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_DOMAIN: ${ORBI_GRAFANA_DOMAIN:-localhost}
    volumes:
      - ./Observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - orbi_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    mem_limit: 1g
    cpus: 0.5
    networks:
      - ops

  database-backup:
    image: ${ORBI_POSTGRES_IMAGE:?Set ORBI_POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${ORBI_POSTGRES_DB}
      PGUSER: ${ORBI_POSTGRES_USER}
      PGPASSWORD: ${ORBI_POSTGRES_PASSWORD}
      ORBI_BACKUP_INTERVAL_SECONDS: ${ORBI_BACKUP_INTERVAL_SECONDS:-86400}
      ORBI_BACKUP_RETENTION_DAYS: ${ORBI_BACKUP_RETENTION_DAYS:-14}
      ORBI_BACKUP_ENCRYPTION_KEY: ${ORBI_BACKUP_ENCRYPTION_KEY:?Set ORBI_BACKUP_ENCRYPTION_KEY}
    entrypoint: ["/bin/sh", "/opt/orbi/backup-postgres.sh"]
    volumes:
      - ./Backup_Recovery/backup-postgres.sh:/opt/orbi/backup-postgres.sh:ro
      - /srv/orbi/backups/database:/backups
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 0.5
    networks:
      - private

  backup-r2-replicator:
    image: ${ORBI_STORAGE_CLIENT_IMAGE:?Set ORBI_STORAGE_CLIENT_IMAGE}
    restart: unless-stopped
    environment:
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_ACCESS_KEY_ID: ${CLOUDFLARE_ACCESS_KEY_ID:?Set CLOUDFLARE_ACCESS_KEY_ID}
      CLOUDFLARE_SECRET_ACCESS_KEY: ${CLOUDFLARE_SECRET_ACCESS_KEY:?Set CLOUDFLARE_SECRET_ACCESS_KEY}
      CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT:-}
      CLOUDFLARE_BUCKET_NAME: ${CLOUDFLARE_BUCKET_NAME:?Set CLOUDFLARE_BUCKET_NAME}
      ORBI_BACKUP_R2_BUCKET: ${ORBI_BACKUP_R2_BUCKET:-orbishop-storage}
      ORBI_BACKUP_R2_PREFIX: ${ORBI_BACKUP_R2_PREFIX:-database-backups}
      ORBI_BACKUP_R2_SYNC_INTERVAL_SECONDS: ${ORBI_BACKUP_R2_SYNC_INTERVAL_SECONDS:-300}
    entrypoint: ["/bin/sh", "/opt/orbi/backup-r2-mirror.sh"]
    volumes:
      - ./Backup_Recovery/backup-r2-mirror.sh:/opt/orbi/backup-r2-mirror.sh:ro
      - /srv/orbi/backups/database:/backups:ro
    depends_on:
      database-backup:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.25
    networks:
      - private

networks:
  private:
    internal: true
  sandbox_private:
    internal: true
  sandbox_test_bridge:
  edge:
  ops:
    internal: true

volumes:
  orbi_postgres_data:
  orbi_postgres_wal_archive:
  orbi_valkey_data:
  orbi_storage_data:
  orbi_sandbox_storage_data:
  orbi_sandbox_postgres_data:
  orbi_sandbox_valkey_data:
  orbi_public_uploads:
  orbi_prometheus_data:
  orbi_grafana_data:
