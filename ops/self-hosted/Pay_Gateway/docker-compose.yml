services:
  keycloak-postgres-sandbox:
    profiles: [sandbox]
    image: postgres:16-bookworm
    container_name: orbi-keycloak-postgres-sandbox
    restart: unless-stopped
    env_file:
      - ${ORBI_KEYCLOAK_SANDBOX_ENV_FILE:-D:/FYNIX/ORBI/SECREATES/ORBI KEYCLOAK SANDBOX ENV.txt}
    volumes:
      - orbi_keycloak_postgres_sandbox:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [orbi_private]

  keycloak-sandbox:
    profiles: [sandbox]
    image: keycloak/keycloak:26.5.0
    container_name: orbi-keycloak-sandbox
    restart: unless-stopped
    command: start --import-realm
    env_file:
      - ${ORBI_KEYCLOAK_SANDBOX_ENV_FILE:-D:/FYNIX/ORBI/SECREATES/ORBI KEYCLOAK SANDBOX ENV.txt}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres-sandbox:5432/keycloak_sandbox
      KC_DB_USERNAME: orbi_keycloak_sandbox
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://auth.orbifinancial.com
      KC_HOSTNAME_STRICT: "true"
    volumes:
      - ../Auth_Security/keycloak/orbi-sandbox-realm.json:/opt/keycloak/data/import/orbi-sandbox-realm.json:ro
    depends_on:
      keycloak-postgres-sandbox:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks:
      orbi_private:
        aliases: [orbi-keycloak-sandbox]
      orbi_edge:
        aliases: [keycloak-sandbox]

  pay-gateway-postgres-live:
    profiles: [live]
    image: postgres:16-bookworm
    container_name: orbi-pay-gateway-postgres-live
    restart: unless-stopped
    env_file:
      - ${ORBI_PAY_GATEWAY_LIVE_ENV_FILE:-D:/FYNIX/ORBI/SECREATES/ORBI PAY GATEWAY LIVE ENV.txt}
    volumes:
      - orbi_pay_gateway_postgres_live:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [orbi_private]

  pay-gateway-postgres-sandbox:
    profiles: [sandbox]
    image: postgres:16-bookworm
    container_name: orbi-pay-gateway-postgres-sandbox
    restart: unless-stopped
    env_file:
      - ${ORBI_PAY_GATEWAY_SANDBOX_ENV_FILE:-D:/FYNIX/ORBI/SECREATES/ORBI PAY GATEWAY SANDBOX ENV.txt}
    volumes:
      - orbi_pay_gateway_postgres_sandbox:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [orbi_private]

  pay-gateway:
    profiles:
      - live
    build:
      context: D:/FYNIX/ORBI/Orbi Infrastructures/ORBI GATEWAY/Pay Gateway Backend
      dockerfile: Dockerfile
    image: orbi-pay-gateway:${ORBI_PAY_GATEWAY_RELEASE_ID:-local}
    container_name: orbi-pay-gateway
    restart: unless-stopped
    env_file:
      - ${ORBI_PAY_GATEWAY_LIVE_ENV_FILE:-D:/FYNIX/ORBI/SECREATES/ORBI PAY GATEWAY LIVE ENV.txt}
    environment:
      NODE_ENV: production
      PAYMENT_GATEWAY_PORT: 3100
      PAYMENT_GATEWAY_PUBLIC_BASE_URL: https://pay.orbifinancial.com
      PAYMENT_GATEWAY_PROVIDER_MODE: live
      PAYMENT_GATEWAY_CREDENTIAL_MODE: tokenized
      PAYMENT_GATEWAY_REQUIRE_STRONG_CUSTOMER_AUTH: "true"
      PAYMENT_GATEWAY_INTERNAL_CORE_TRANSPORT_MODE: private_http
      PAYMENT_GATEWAY_OIDC_IDENTITY_ISSUER: ${PAYMENT_GATEWAY_OIDC_IDENTITY_ISSUER:-https://auth.orbifinancial.com/realms/orbi}
      PAYMENT_GATEWAY_OIDC_IDENTITY_BACKCHANNEL_URL: http://orbi-keycloak:8080/realms/orbi
      PAYMENT_GATEWAY_OIDC_IDENTITY_AUDIENCE: ${PAYMENT_GATEWAY_OIDC_IDENTITY_AUDIENCE:-orbi-pay-identity}
      PAYMENT_GATEWAY_OIDC_AUTHORIZATION_CLIENT_ID: ${PAYMENT_GATEWAY_OIDC_AUTHORIZATION_CLIENT_ID:-orbi-pay-developers}
      PAYMENT_GATEWAY_FINANCIAL_TOKEN_AUDIENCE: ${PAYMENT_GATEWAY_FINANCIAL_TOKEN_AUDIENCE:-orbi-pay-api}
      PAYMENT_GATEWAY_PROVIDER_MANIFEST_PATH: /app/config/providers.json
      PAYMENT_GATEWAY_SERVICE_REGISTRY_PATH: /app/config/services.json
      PAYMENT_GATEWAY_OBP_SANDBOX_TOOLS_ENABLED: "false"
      PAYMENT_GATEWAY_RECONCILIATION_EXPORT_PATH: /app/reconciliation
      PAYMENT_GATEWAY_RECONCILIATION_SCHEDULE_ENABLED: "true"
      PAYMENT_GATEWAY_RECONCILIATION_SCHEDULE_INTERVAL_MINUTES: "1440"
      PAYMENT_GATEWAY_RECONCILIATION_SCHEDULE_WINDOW_HOURS: "24"
      PAYMENT_GATEWAY_RECONCILIATION_SCHEDULE_RUN_ON_START: "false"
      PAYMENT_GATEWAY_OPERATOR_ALERT_SINK_PATH: /app/alerts/reconciliation-alerts.jsonl
      PAYMENT_GATEWAY_INCIDENT_ESCALATION_ENABLED: "true"
      PAYMENT_GATEWAY_INCIDENT_ESCALATION_INTERVAL_MINUTES: "5"
      PAYMENT_GATEWAY_INCIDENT_CRITICAL_SLA_MINUTES: "15"
      PAYMENT_GATEWAY_INCIDENT_WARNING_SLA_MINUTES: "60"
      PAYMENT_GATEWAY_AUDIT_EVENT_SINK_PATH: /app/audit/audit-events.jsonl
      PAYMENT_GATEWAY_OAUTH_ISSUER_URL: https://pay.orbifinancial.com
      PAYMENT_GATEWAY_OAUTH_INTROSPECTION_URL: https://pay.orbifinancial.com/oauth/introspect
      PAYMENT_GATEWAY_ORBI_TALK_ENABLED: ${PAYMENT_GATEWAY_ORBI_TALK_ENABLED:-true}
      ORBI_TALK_GATEWAY_URL: ${ORBI_TALK_GATEWAY_URL:-https://talk.orbifinancial.com}
      ORBI_TALK_MESSAGING_INTENT_PATH: /api/send-email
      ORBI_TALK_GATEWAY_TIMEOUT_MS: ${ORBI_TALK_GATEWAY_TIMEOUT_MS:-2500}
      PAYMENT_GATEWAY_MESSAGING_DELIVERY_STORE_PATH: /app/messaging/messaging-deliveries.json
    volumes:
      - ${ORBI_PAY_GATEWAY_BACKEND_ROOT:-../../../../../../ORBI GATEWAY/Pay Gateway Backend}/config/providers.example.json:/app/config/providers.json:ro
      - ${ORBI_PAY_GATEWAY_BACKEND_ROOT:-../../../../../../ORBI GATEWAY/Pay Gateway Backend}/config/services.json:/app/config/services.json:ro
      - ${ORBI_PAY_GATEWAY_RECONCILIATION_REPORTS_ROOT:-../../../../../../ORBI GATEWAY/Reconciliation Reports/live}:/app/reconciliation
      - ${ORBI_PAY_GATEWAY_ALERTS_ROOT:-../../../../../../ORBI GATEWAY/Operator Alerts/live}:/app/alerts
      - ${ORBI_PAY_GATEWAY_AUDIT_EVENTS_ROOT:-../../../../../../ORBI GATEWAY/Audit Events/live}:/app/audit
      - ${ORBI_PAY_GATEWAY_MESSAGING_ROOT:-../../../../../../ORBI GATEWAY/Messaging Deliveries/live}:/app/messaging
      - ${ORBI_PAY_GATEWAY_MTLS_CERT_DIRECTORY:-D:/FYNIX/ORBI/SECREATES/ORBI_MTLS}:/opt/orbi/mtls:ro
    ports:
      - "${ORBI_PAY_GATEWAY_BIND_ADDRESS:-127.0.0.1}:3100:3100"
    depends_on:
      pay-gateway-postgres-live:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - orbi_private
      - orbi_edge

  pay-gateway-sandbox:
    profiles:
      - sandbox
    build:
      context: D:/FYNIX/ORBI/Orbi Infrastructures/ORBI GATEWAY/Pay Gateway Backend
      dockerfile: Dockerfile
    image: orbi-pay-gateway:${ORBI_PAY_GATEWAY_RELEASE_ID:-local}
    container_name: orbi-pay-gateway-sandbox
    restart: unless-stopped
    env_file:
      - ${ORBI_PAY_GATEWAY_SANDBOX_ENV_FILE:-D:/FYNIX/ORBI/SECREATES/ORBI PAY GATEWAY SANDBOX ENV.txt}
    environment:
      NODE_ENV: production
      PAYMENT_GATEWAY_PORT: 3101
      PAYMENT_GATEWAY_PUBLIC_BASE_URL: https://sandbox-pay.orbifinancial.com
      PAYMENT_GATEWAY_PROVIDER_MODE: sandbox
      PAYMENT_GATEWAY_CREDENTIAL_MODE: tokenized
      PAYMENT_GATEWAY_REQUIRE_STRONG_CUSTOMER_AUTH: "true"
      PAYMENT_GATEWAY_INTERNAL_CORE_TRANSPORT_MODE: private_http
      PAYMENT_GATEWAY_OIDC_IDENTITY_ISSUER: ${PAYMENT_GATEWAY_SANDBOX_OIDC_IDENTITY_ISSUER:-https://auth.orbifinancial.com/realms/orbi-sandbox}
      # Temporary compatibility route until Cloudflare maps the public sandbox
      # identity hostname to keycloak-sandbox. Switching early causes JWKS mismatch.
      PAYMENT_GATEWAY_OIDC_IDENTITY_BACKCHANNEL_URL: http://keycloak-sandbox:8080/realms/orbi-sandbox
      PAYMENT_GATEWAY_OIDC_IDENTITY_AUDIENCE: ${PAYMENT_GATEWAY_SANDBOX_OIDC_IDENTITY_AUDIENCE:-orbi-pay-sandbox-identity}
      PAYMENT_GATEWAY_OIDC_AUTHORIZATION_CLIENT_ID: ${PAYMENT_GATEWAY_SANDBOX_OIDC_AUTHORIZATION_CLIENT_ID:-orbi-pay-sandbox-developers}
      PAYMENT_GATEWAY_FINANCIAL_TOKEN_AUDIENCE: ${PAYMENT_GATEWAY_SANDBOX_FINANCIAL_TOKEN_AUDIENCE:-orbi-pay-sandbox-api}
      PAYMENT_GATEWAY_PROVIDER_MANIFEST_PATH: /app/config/providers.json
      PAYMENT_GATEWAY_SERVICE_REGISTRY_PATH: /app/config/services.json
      PAYMENT_GATEWAY_OBP_SANDBOX_TOOLS_ENABLED: "true"
      PAYMENT_GATEWAY_RECONCILIATION_EXPORT_PATH: /app/reconciliation
      PAYMENT_GATEWAY_RECONCILIATION_SCHEDULE_ENABLED: "true"
      PAYMENT_GATEWAY_RECONCILIATION_SCHEDULE_INTERVAL_MINUTES: "1440"
      PAYMENT_GATEWAY_RECONCILIATION_SCHEDULE_WINDOW_HOURS: "24"
      PAYMENT_GATEWAY_RECONCILIATION_SCHEDULE_RUN_ON_START: "false"
      PAYMENT_GATEWAY_OPERATOR_ALERT_SINK_PATH: /app/alerts/reconciliation-alerts.jsonl
      PAYMENT_GATEWAY_INCIDENT_ESCALATION_ENABLED: "true"
      PAYMENT_GATEWAY_INCIDENT_ESCALATION_INTERVAL_MINUTES: "5"
      PAYMENT_GATEWAY_INCIDENT_CRITICAL_SLA_MINUTES: "15"
      PAYMENT_GATEWAY_INCIDENT_WARNING_SLA_MINUTES: "60"
      PAYMENT_GATEWAY_AUDIT_EVENT_SINK_PATH: /app/audit/audit-events.jsonl
      PAYMENT_GATEWAY_OAUTH_ISSUER_URL: https://sandbox-pay.orbifinancial.com
      PAYMENT_GATEWAY_OAUTH_INTROSPECTION_URL: https://sandbox-pay.orbifinancial.com/oauth/introspect
      PAYMENT_GATEWAY_ORBI_TALK_ENABLED: ${PAYMENT_GATEWAY_SANDBOX_ORBI_TALK_ENABLED:-true}
      ORBI_TALK_GATEWAY_URL: ${ORBI_TALK_GATEWAY_URL:-https://talk.orbifinancial.com}
      ORBI_TALK_MESSAGING_INTENT_PATH: /api/send-email
      ORBI_TALK_GATEWAY_TIMEOUT_MS: ${ORBI_TALK_GATEWAY_TIMEOUT_MS:-2500}
      PAYMENT_GATEWAY_MESSAGING_DELIVERY_STORE_PATH: /app/messaging/messaging-deliveries.json
      ORBI_CORE_INTERNAL_BASE_URL: http://core-sandbox:3001
      ORBI_CORE_TRUSTED_PUSH_NOTIFICATION_PATH: /api/internal/pay-gateway/notifications/push
      PAYMENT_GATEWAY_WORKER_SCOPES: gateway:events:write,gateway:service-payments:write,gateway:service-payments:result,gateway:identity:read,gateway:notifications:push,gateway:paysafe-balances:read,gateway:business-registration:write,gateway:payment-profiles:write,gateway:merchant-payments:read,gateway:merchant-settlements:read
    volumes:
      - ${ORBI_PAY_GATEWAY_BACKEND_ROOT:-../../../../../../ORBI GATEWAY/Pay Gateway Backend}/config/providers.example.json:/app/config/providers.json:ro
      - ${ORBI_PAY_GATEWAY_BACKEND_ROOT:-../../../../../../ORBI GATEWAY/Pay Gateway Backend}/config/services.json:/app/config/services.json:ro
      - ${ORBI_PAY_GATEWAY_RECONCILIATION_SANDBOX_REPORTS_ROOT:-../../../../../../ORBI GATEWAY/Reconciliation Reports/sandbox}:/app/reconciliation
      - ${ORBI_PAY_GATEWAY_ALERTS_SANDBOX_ROOT:-../../../../../../ORBI GATEWAY/Operator Alerts/sandbox}:/app/alerts
      - ${ORBI_PAY_GATEWAY_AUDIT_EVENTS_SANDBOX_ROOT:-../../../../../../ORBI GATEWAY/Audit Events/sandbox}:/app/audit
      - ${ORBI_PAY_GATEWAY_MESSAGING_SANDBOX_ROOT:-../../../../../../ORBI GATEWAY/Messaging Deliveries/sandbox}:/app/messaging
      - ${ORBI_PAY_GATEWAY_SANDBOX_MTLS_CERT_DIRECTORY:-D:/FYNIX/ORBI/SECREATES/ORBI_MTLS_SANDBOX}:/opt/orbi/mtls:ro
    ports:
      - "${ORBI_PAY_GATEWAY_SANDBOX_BIND_ADDRESS:-127.0.0.1}:3101:3101"
    depends_on:
      pay-gateway-postgres-sandbox:
        condition: service_healthy
      keycloak-sandbox:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3101/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - orbi_private
      - orbi_edge
      - orbi_sandbox_private

networks:
  orbi_private:
    name: orbi-private
    external: true
  orbi_edge:
    name: orbi-edge
    external: true
  orbi_sandbox_private:
    name: orbi_sandbox_private
    external: true

volumes:
  orbi_pay_gateway_postgres_live:
  orbi_pay_gateway_postgres_sandbox:
  orbi_keycloak_postgres_sandbox:
