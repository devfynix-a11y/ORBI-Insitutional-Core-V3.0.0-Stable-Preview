user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format orbi_json escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
      '"request_id":"$request_id","method":"$request_method","uri":"$request_uri",'
      '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
      '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log orbi_json;
    error_log /var/log/nginx/error.log warn;

    server_tokens off;
    client_max_body_size 20m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 30s;

    limit_req_zone $binary_remote_addr zone=orbi_api:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=orbi_conn:10m;

    # Docker service IPs change whenever a container is recreated. Keep the
    # upstream names dynamically resolved so the public gateway cannot retain
    # a dead container IP after an otherwise healthy deployment.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream orbi_core {
        zone orbi_core 64k;
        server core:3000 resolve;
        keepalive 64;
    }

    upstream orbi_identity {
        zone orbi_identity 64k;
        server keycloak:8080 resolve;
        keepalive 32;
    }

    upstream orbi_identity_sandbox {
        zone orbi_identity_sandbox 64k;
        server keycloak-sandbox:8080 resolve;
        keepalive 32;
    }

    upstream orbi_pay_gateway {
        zone orbi_pay_gateway 64k;
        server pay-gateway:3100 resolve;
        keepalive 32;
    }

    upstream orbi_pay_gateway_sandbox {
        zone orbi_pay_gateway_sandbox 64k;
        server pay-gateway-sandbox:3101 resolve;
        keepalive 32;
    }

    upstream orbi_core_sandbox {
        zone orbi_core_sandbox 64k;
        server core-sandbox:3001 resolve;
        keepalive 32;
    }

    server {
        listen 80;
        server_name auth.orbifinancial.com;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = / {
            add_header Cache-Control "no-store" always;
            root /usr/share/nginx/orbi-auth;
            try_files /index.html =404;
        }

        # Keycloak administration is internal-only. Core reaches these routes
        # over the private Docker network; they must never be reachable through
        # the customer identity hostname.
        location = /admin {
            return 404;
        }

        location ^~ /admin/ {
            return 404;
        }

        location = /realms/master {
            return 404;
        }

        location ^~ /realms/master/ {
            return 404;
        }

        location ^~ /realms/orbi-sandbox/ {
            proxy_pass http://orbi_identity_sandbox;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            limit_req zone=orbi_api burst=30 nodelay;
            limit_conn orbi_conn 20;

            proxy_pass http://orbi_identity;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 75s;
        }
    }

    server {
        listen 80;
        server_name api.orbifinancial.com;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = /health {
            proxy_pass http://orbi_core;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            limit_req zone=orbi_api burst=60 nodelay;
            limit_conn orbi_conn 40;

            proxy_pass http://orbi_core;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Orbi-Environment live;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
            proxy_send_timeout 30s;
        }
    }

    server {
        listen 80;
        server_name pay.orbifinancial.com;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = /health {
            proxy_pass http://orbi_pay_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /ready {
            proxy_pass http://orbi_pay_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            limit_req zone=orbi_api burst=40 nodelay;
            limit_conn orbi_conn 30;

            proxy_pass http://orbi_pay_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Orbi-Environment live;
            proxy_read_timeout 75s;
            proxy_send_timeout 30s;
        }
    }

    server {
        listen 80;
        server_name sandbox-pay.orbifinancial.com;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        location = /health {
            proxy_pass http://orbi_pay_gateway_sandbox;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /ready {
            proxy_pass http://orbi_pay_gateway_sandbox;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            limit_req zone=orbi_api burst=80 nodelay;
            limit_conn orbi_conn 40;

            proxy_pass http://orbi_pay_gateway_sandbox;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Orbi-Environment sandbox;
            proxy_read_timeout 75s;
            proxy_send_timeout 30s;
        }
    }

    server {
        listen 80;
        server_name sandbox-api.orbifinancial.com;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        location / {
            limit_req zone=orbi_api burst=80 nodelay;
            limit_conn orbi_conn 40;
            proxy_pass http://orbi_core_sandbox;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Orbi-Environment sandbox;
            proxy_read_timeout 75s;
            proxy_send_timeout 30s;
        }
    }
    server {
        listen 80;
        server_name ops.orbifinancial.com;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        location / {
            limit_req zone=orbi_api burst=20 nodelay;
            limit_conn orbi_conn 10;

            proxy_pass http://orbi_core;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 75s;
            proxy_send_timeout 30s;
        }
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
}
